{% load octagon %}
<form method="post" class="form" novalidate>
  {% csrf_token %}
  {{ form.website }}
  {% if form.non_field_errors %}<div class="alert alert-error">{{ form.non_field_errors }}</div>{% endif %}
  <div class="form-grid">
    {% for field in form.visible_fields %}
    <div class="field {% if field.name == 'message' %}field-full{% endif %} {% if field.errors %}has-error{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
      {{ field }}
      {% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}
    </div>
    {% endfor %}
  </div>
  <button type="submit" class="btn btn-primary btn-lg">{{ submit_label|default:"Send message" }} {% icon "arrow-up-right" 16 %}</button>
</form>

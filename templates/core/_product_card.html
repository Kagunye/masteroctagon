{% load octagon %}<a href="{{ p.get_absolute_url }}" class="card reveal">
  <div class="card-media card-media-product"><img src="{{ p.image_url|md }}" alt="{{ p.name }}" loading="lazy">{% if p.category.code %}<span class="badge">{{ p.category.code }}</span>{% endif %}</div>
  <p class="eyebrow">{{ p.category.name }}{% if p.brand %} · {{ p.brand }}{% endif %}</p>
  <h3>{{ p.name }}</h3>
  <p class="desc">{{ p.summary }}</p>
  <span class="link-arrow">View details {% icon 'arrow-up-right' 14 %}</span>
</a>
